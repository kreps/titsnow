<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>titsnow</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
    }
  </style>
</head>
<body>
  <h1>titsnow</h1>
  <audio id="jingle" src="le_tits_now_jingle_bells.mp3" autoplay loop></audio>
  <script>
    // Brauserid blokeerivad heliga autoplay'd enne esimest kasutaja tegevust,
    // seega proovime uuesti esimese kliki/klahvivajutuse peale.
    const audio = document.getElementById('jingle');
    const start = () => audio.play().catch(() => {});
    start();
    ['click', 'keydown', 'touchstart'].forEach(e =>
      document.addEventListener(e, start, { once: true }));
  </script>
</body>
</html>
